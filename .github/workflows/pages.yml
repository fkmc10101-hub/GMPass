# main 브랜치에 올릴 때마다 체험용 데모를 GitHub Pages에 배포한다.
# 처음 한 번: 저장소 Settings → Pages → Build and deployment → Source를 "GitHub Actions"로 선택.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 데모 데이터 확인
        run: test -f public/demo/snapshot.json || (echo "frontend/public/demo/snapshot.json이 없습니다. backend에서 python -m scripts.export_demo 를 먼저 실행하세요." && exit 1)
      - run: npm ci
      - name: 데모 모드로 빌드
        run: npm run build
        env:
          VITE_DEMO: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
